<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konvent · Habitacions</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#dfdfdf;--surface:#fff;--surface2:#f0efe9;--border:#e0dfd8;--border2:#ccc;
  --text:#1a1a18;--text2:#666;--text3:#999;
  --blue:#185FA5;--blue-bg:#e6f1fb;--blue-border:#b5d4f4;
  --green:#3b6d11;--green-bg:#eaf3de;--green-border:#c0dd97;
  --red:#a32d2d;--red-bg:#fcebeb;
  --radius:8px;--radius-lg:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:18px;min-height:100vh}
.app{max-width:1400px;margin:0 auto;padding:0 0 60px}
header{padding:12px 16px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.logo{font-size:23px;font-weight:700;margin-right:6px;white-space:nowrap}
.tabs{display:flex;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:11px 16px;cursor:pointer;font-size: clamp(14px, 4vw, 24px);border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;color:var(--text2);transition:color .15s}
.tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:600}
.tab:hover:not(.active){color:var(--text)}

.panel{padding:16px}
.section-label{font-size:14px;font-weight:700;color:var(--text3);text-transform:uppercase;margin:16px 0 8px;display:block;letter-spacing:.06em}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;position:relative}

.form-box{background:var(--surface2);border-radius:var(--radius);padding:14px;margin:0 0 16px}
.form-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px}
.field label{font-size:11px;font-weight:600;color:var(--text2)}
.field input,.field select{padding:7px 9px;border:1px solid var(--border2);border-radius:6px;font-size:13px;width:100%;background:var(--surface);color:var(--text);font-family:inherit}
.field input:focus,.field select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(24,95,165,.1)}

.btn{padding:7px 13px;border-radius:6px;border:1px solid var(--border2);background:var(--surface);cursor:pointer;font-weight:500;font-size:12px;white-space:nowrap;font-family:inherit;color:var(--text);transition:background .12s}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--text);color:var(--bg);border:none}
.btn.primary:hover{opacity:.85}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.danger:hover{background:var(--red-bg)}

.badge{font-size:10px;padding:3px 7px;border-radius:4px;font-weight:700}



/* Calendar desktop */
.cal-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface); max-height: calc(100vh - 230px);}
.cal-table{border-collapse:separate;border-spacing:0;width:max-content;font-size:12px;table-layout:fixed}
.cal-table th,.cal-table td{border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.cal-table th{background:var(--surface2);position:sticky;top:0;z-index:20;height:36px;text-align:center;font-weight:600;font-size:11px;color:var(--text2);overflow:hidden}
.room-col{position:sticky;left:0;background:var(--surface2)!important;z-index:21!important;text-align:left;padding:0 10px;width:140px;min-width:140px;max-width:140px}
.floor-sep td,.floor-sep th{border-bottom:2.5px solid var(--text)!important}
.p-bar{width:100%;height:100%;border-radius:3px;font-size:10px;display:flex;align-items:center;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.p-bar:hover{filter:brightness(.92)}

.unassigned-row {
  background-color: rgba(255, 193, 7, 0.05); /* Un tono amarillento muy suave */
  border-bottom: 2px solid #ffc107 !important;
}
.unassigned-label {
  color: #ffc107;
  font-weight: bold;
  font-size: 0.8em;
  text-transform: uppercase;
}

/* Calendar mobile */
.cal-mobile{display:none}
.mob-person{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);margin-bottom:6px;border:1px solid var(--border);background:var(--surface)}
.mob-bar{width:5px;border-radius:3px;align-self:stretch;flex-shrink:0}
.mob-dates{font-size:11px;color:var(--text2)}
.mob-room{font-size:12px;font-weight:600;color:var(--blue)}
.mob-noroom{font-size:12px;color:var(--text3)}

@media(max-width:640px){
  .cal-desktop{display:block}
  .cal-mobile{display:none}

/*calendari mobil*/
  .room-col {
    width: 75px;      /* Se achica solo en móvil */
    min-width: 75px;
    padding: 0 4px;
    font-size: 10px;  /* Letra más pequeña solo en móvil */
    word-wrap: break-word;
  }

  .cal-table th, .cal-table td {
    width: 32px !important;    /* Celdas más estrechas solo en móvil */
    min-width: 32px !important;
    font-size: 10px;
  }
}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--radius-lg);padding:22px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--text2);margin-bottom:14px}
.assign-opt{padding:11px 13px;border:1px solid var(--border);border-radius:8px;margin-bottom:7px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .15s;font-size:13px}
.assign-opt:hover{background:var(--blue-bg);border-color:var(--blue-border)}

/* Color picker for groups */
.color-swatches{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s,border-color .1s}
.swatch:hover{transform:scale(1.15)}
.swatch.selected{border-color:var(--text);transform:scale(1.1)}

summary{list-style:none}
summary::-webkit-details-marker{display:none}
.comment-fab{position:fixed;bottom:24px;right:20px;z-index:50;background:var(--text);color:var(--bg);border:none;border-radius:50px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25);display:flex;align-items:center;gap:7px;font-family:inherit;transition:opacity .15s}
.comment-fab:hover{opacity:.85}
.comment-panel{position:fixed;bottom:0;right:0;width:100%;max-width:400px;height:70vh;background:var(--surface);border-top:1px solid var(--border);border-left:1px solid var(--border);border-radius:16px 0 0 0;z-index:80;display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.12);transform:translateY(100%);transition:transform .25s ease}
.comment-panel.open{transform:translateY(0)}
.comment-panel-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.comment-panel-header h4{font-size:14px;font-weight:600;margin:0}
.comment-list{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.comment-item{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13px}
.comment-author{font-weight:600;font-size:12px;color:var(--blue);margin-bottom:3px}
.comment-time{font-size:10px;color:var(--text3);margin-top:4px}
.comment-form{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;gap:7px}
.comment-form input,.comment-form textarea{padding:8px 10px;border:1px solid var(--border2);border-radius:8px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);resize:none;width:100%}
.comment-form textarea{height:60px}
.comment-form input:focus,.comment-form textarea:focus{outline:none;border-color:var(--blue)}
@media(max-width:480px){.comment-panel{max-width:100%;border-radius:16px 16px 0 0;border-left:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <img src="konvent-logo.webp" width="120px">
    <div class="logo">Habitacions</div>
    <div class="tabs">
        <button class="tab" onclick="setTab(0)">Persones</button>
      <button class="tab" onclick="setTab(1)">Habitacions</button>
      <button class="tab" onclick="setTab(2)">Grups</button>
      <button class="tab active" onclick="setTab(3)">Calendari</button>
    </div>
    <div style="flex-grow: 1;"></div>

    <div id="onlineIndicator" style="display:none;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 10px 3px 7px;font-size:12px;color:var(--text2);white-space:nowrap">
      <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0;box-shadow:0 0 0 2px rgba(34,197,94,.25)"></span>
      <span id="onlineCount">0</span> connectat<span id="onlinePlural">s</span>
    </div>

    <div style="display: flex; gap: 5px;">
        <button id="btnUndo" onclick="deshacer()" title="Deshacer (Ctrl+Z)">🔙 Deshacer</button>
        <button id="btnRedo" onclick="rehacer()" title="Rehacer (Ctrl+Y)">🔜 Rehacer</button>
    </div>
  </header>
  <div id="root" class="panel"></div>
</div>

<button class="comment-fab" id="commentFab">
  💬 <span id="commentFabLabel">Comentaris</span>
</button>

<div class="comment-panel" id="commentPanel">
  <div class="comment-panel-header">
    <h4>💬 Comentaris</h4>
    <button class="btn" id="commentClose" style="padding:4px 10px;font-size:12px">Tancar ✕</button>
  </div>
  <div class="comment-list" id="commentList">
    <div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Carregant…</div>
  </div>
  <div class="comment-form">
    <input id="commentAuthor" placeholder="El teu nom" maxlength="60">
    <textarea id="commentText" placeholder="Escriu el teu comentari…" maxlength="500"></textarea>
    <button class="btn primary" id="commentSubmit" style="width:100%">Enviar comentari</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getDatabase, ref, onValue, push, set as rtdbSet, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyABO2uZ9Bg8Zxp4MmLLWbGDMjbq15NCN5o",
  authDomain: "konvent-habitacions.firebaseapp.com",
  projectId: "konvent-habitacions",
  storageBucket: "konvent-habitacions.firebasestorage.app",
  messagingSenderId: "235916387007",
  appId: "1:235916387007:web:11e5dd47aa09e3126e5c0a",
  databaseURL: "https://konvent-habitacions-default-rtdb.europe-west1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const rtdb = getDatabase(app);

// ── Presence system ───────────────────────────────────────────────────────────
const presenceRef = ref(rtdb, 'presence');
const myRef = push(presenceRef); // unique key for this session
onDisconnect(myRef).remove();    // auto-remove when tab closes
rtdbSet(myRef, { t: Date.now() });

onValue(presenceRef, snap => {
  const count = snap.exists() ? Object.keys(snap.val()).length : 0;
  const el = document.getElementById('onlineCount');
  const pl = document.getElementById('onlinePlural');
  const ind = document.getElementById('onlineIndicator');
  if (el) {
    el.textContent = count;
    if (pl) pl.textContent = count === 1 ? '' : 's';
    if (ind) ind.style.display = 'flex';
  }
});

// ── Palette ──────────────────────────────────────────────────────────────────
// CAMBIO 1: Reducido a 7 colores
const PALETTE = [
  '#3B82F6', '#8B5CF6', '#EC4899', '#EF4444', '#F97316', '#EAB308', '#22C55E'
];

// Returns {bg, text} for a hex color — dark text on light bg, light on dark
function contrastStyle(hex) {
  if (!hex) return { bg: '#3B82F6', text: '#ffffff' };
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return { bg: hex, text: lum > 0.55 ? '#1a1a18' : '#ffffff' };
}

// ── State ────────────────────────────────────────────────────────────────────
let rooms = [], people = [], groups = [];
let tab = 3, calOffset = 0;
let assignCtx = null, editRoomId = null, editPersonId = null, editGroupId = null;
let pendingGroupColor = null;
let newGroupMembers = [];
let historial = [];      // Pila para Deshacer (Undo)
let historialRedo = [];  // Pila para Rehacer (Redo)
const LIMITE_HISTORIAL = 30;

const registrarAccion = (accion) => {
    historial.push(accion);
    
    // Si nos pasamos de 30, borramos la primera (la más vieja)
    if (historial.length > LIMITE_HISTORIAL) {
        historial.shift();
    }
    
    // Muy importante: ¡Si hay una acción nueva, el Redo se borra!
    historialRedo = []; 
};

// ── Firestore ─────────────────────────────────────────────────────────────────
onSnapshot(collection(db,'rooms'),   s => { rooms   = s.docs.map(d=>({id:d.id,...d.data()})); render(); });
onSnapshot(collection(db,'groups'),  s => { groups  = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name)); render(); });
onSnapshot(collection(db,'people'),  s => { people  = s.docs.map(d=>({id:d.id,...d.data()})); render(); });

onSnapshot(query(collection(db,'comments'), orderBy('createdAt','desc')), snap => {
  renderComments(snap.docs.map(d=>({id:d.id,...d.data()})));
});

// ── Utils ─────────────────────────────────────────────────────────────────────
const e    = s => s?.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') || '';
const pad  = n => n < 10 ? '0'+n : n;
const ds   = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const diff = (a,b) => Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
// Convierte "2026-05-12" en "12-05"
const fmtDM = s => s ? s.split('-').reverse().slice(0, 2).join('-') : '';

function groupStyle(groupId) {
  const g = groups.find(x => x.id === groupId);
  return contrastStyle(g?.color || null);
}

// ── Actions ───────────────────────────────────────────────────────────────────
window.setTab = i => { tab=i; editRoomId=null; editPersonId=null; editGroupId=null; assignCtx=null; render(); };
window.setEditRoom   = id => { editRoomId=id; render(); };
window.setEditPerson = id => { editPersonId=id; render(); };
window.setEditGroup  = id => { editGroupId=id; pendingGroupColor=id?groups.find(g=>g.id===id)?.color||PALETTE[0]:null; render(); };
window.changeCalOffset = v => { calOffset+=v; render(); };
window.openAssignPerson = pId => { assignCtx={pId}; render(); };
window.openAssignRoom   = (rId,d) => { assignCtx={rId,d}; render(); };
window.closeModal = () => { assignCtx=null; render(); };
window.pickColor  = hex => { pendingGroupColor=hex; render(); };

window.addGroupMemberRow = () => { newGroupMembers.push({name:'',from:'',to:''}); render(); };
window.removeGroupMemberRow = idx => { newGroupMembers.splice(idx,1); render(); };
window.updateGroupMember = (idx,field,val) => { newGroupMembers[idx][field]=val; };

window.addRoom = async () => {
  const name = document.getElementById('rName').value.trim();
  if (!name) return;

  // 1. Capturamos el tipo y las fechas (igual que en update)
  const type = document.getElementById('rType').value; // Asegúrate que el select de creación tenga este ID
  const availabilities = [];

  if (type === 'casa') {
    // Importante: Si usas la misma clase .avail-row para crear y editar, 
    // asegúrate de que addRoom solo lea los del formulario de creación.
    // Una forma fácil es buscar solo dentro del contenedor de creación:
    document.querySelectorAll('#newCasaDatesSection .avail-row').forEach(row => {
      const start = row.querySelector('.avail-start').value;
      const end = row.querySelector('.avail-end').value;
      if (start && end) availabilities.push({ start, end });
    });
  }

  // 2. Guardamos en Firebase con los nuevos campos
  await addDoc(collection(db, 'rooms'), {
    name,
    capacity: parseInt(document.getElementById('rCap').value) || 2,
    floor: document.getElementById('rFloor').value.trim() || '1',
    type: type,
    availabilities: availabilities
  });

  // 3. Limpiamos el formulario
  document.getElementById('rName').value = '';
  document.getElementById('rCap').value = '2';
  document.getElementById('rFloor').value = '1';
  if(document.getElementById('availListNew')) document.getElementById('availListNew').innerHTML = '';
  render();
};

window.addGroup = async () => {
  const name = document.getElementById('gName').value.trim();
  if (!name) return;
  const color   = pendingGroupColor || PALETTE[groups.length % PALETTE.length];
  const gFrom   = document.getElementById('gFrom').value;
  const gTo     = document.getElementById('gTo').value;
  const groupRef = await addDoc(collection(db,'groups'), {name, color, from:gFrom, to:gTo});
  const rows = document.querySelectorAll('.new-member-row');
  for (const row of rows) {
    const pName = row.querySelector('.m-name').value.trim();
    if (!pName) continue;
    const pFrom = row.querySelector('.m-from').value || gFrom;
    const pTo   = row.querySelector('.m-to').value   || gTo;
    if (!pFrom || !pTo) continue;
    await addDoc(collection(db,'people'), {name:pName, from:pFrom, to:pTo, groupId:groupRef.id, roomId:null});
  }
  document.getElementById('gName').value='';
  document.getElementById('gFrom').value='';
  document.getElementById('gTo').value='';
  newGroupMembers=[];
  pendingGroupColor=null;
  render();
};

window.saveGroup = async id => {
  const name=document.getElementById('egName').value.trim();
  if (!name) return;
  await updateDoc(doc(db,'groups',id),{name, color:pendingGroupColor||PALETTE[0]});
  editGroupId=null; render();
};

window.addPerson = async () => {
  const name=document.getElementById('pName').value.trim();
  const from=document.getElementById('pFrom').value;
  const to=document.getElementById('pTo').value;
  if (!name||!from||!to) return;
  if (from>=to) { alert('La sortida ha de ser posterior a l\'entrada'); return; }
  await addDoc(collection(db,'people'),{
    name, from, to,
    groupId:document.getElementById('pGroup').value||null,
    roomId:null
  });
  document.getElementById('pName').value='';
};

window.savePersonEdit = async id => {
  const name=document.getElementById('epName').value.trim();
  const from=document.getElementById('epFrom').value;
  const to=document.getElementById('epTo').value;
  if (!name||!from||!to) return;
  await updateDoc(doc(db,'people',id),{
    name, from, to,
    groupId:document.getElementById('epGroup').value||null
  });
  editPersonId=null; render();
};

window.updateRoom = async id => {
  // 1. Recogemos el tipo (Resident o Casa)
  const type = document.getElementById('erType').value;
  const availabilities = [];

  // 2. Si es Casa, recogemos los rangos de fechas del DOM
  if (type === 'casa') {
    document.querySelectorAll('.avail-row').forEach(row => {
      const start = row.querySelector('.avail-start').value;
      const end = row.querySelector('.avail-end').value;
      if (start && end) {
        availabilities.push({ start, end });
      }
    });
  }

  // 3. Actualizamos Firebase con los nuevos campos
  await updateDoc(doc(db, 'rooms', id), {
    name: document.getElementById('erName').value.trim(),
    capacity: parseInt(document.getElementById('erCap').value) || 2,
    floor: document.getElementById('erFloor').value.trim() || '1',
    type: type,               // <--- Nuevo campo
    availabilities: availabilities // <--- Nuevo campo
  });

  editRoomId = null; 
  render();
};

window.delItem = async (coll,id) => {
  if (!confirm('Eliminar?')) return;
  await deleteDoc(doc(db,coll,id));
};

window.assignLlit = async (pId, rId) => {
  if (rId) {
    const r=rooms.find(x=>x.id===rId);
    const p=people.find(x=>x.id===pId);
    const occs=people.filter(x=>x.roomId===r.id&&x.id!==p.id&&x.from<p.to&&x.to>p.from);
    if (occs.length >= r.capacity) {
      if (!confirm(`⚠️ L'habitació "${r.name}" estarà plena en les dates de ${p.name}.\n\nForçar l'assignació?`)) return;
    }
  }
  await updateDoc(doc(db,'people',pId),{roomId:rId||null});
  assignCtx=null; render();
};

// ── Person card ───────────────────────────────────────────────────────────────
function renderPersonCard(p) {
  const r = rooms.find(x=>x.id===p.roomId);
  const g = groups.find(x=>x.id===p.groupId);
  const cs = g ? contrastStyle(g.color) : null;

  if (editPersonId === p.id) {
    const groupOpts = groups.map(grp=>`<option value="${grp.id}" ${grp.id===p.groupId?'selected':''}>${e(grp.name)}</option>`).join('');
    return `<div class="card" style="border:2px solid var(--text);grid-column:1/-1">
      <div class="form-row">
        <div class="field"><label>Nom</label><input id="epName" value="${e(p.name)}"></div>
        <div class="field"><label>Entrada</label><input id="epFrom" type="date" value="${p.from}"></div>
        <div class="field"><label>Sortida</label><input id="epTo" type="date" value="${p.to}"></div>
        <div class="field"><label>Grup</label><select id="epGroup"><option value="">Sense grup</option>${groupOpts}</select></div>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button class="btn primary" onclick="savePersonEdit('${p.id}')">Guardar</button>
        <button class="btn" onclick="setEditPerson(null)">Cancel·lar</button>
      </div>
    </div>`;
  }

      <button class="btn" onclick="openAssignPerson('${p.id}')">Canviar hab.</button>

}

  // ── 2: GRUPS ────────────────────────────────────────────────────────────────

              <div class="field"><label>Entrada <small style="font-weight:400;color:var(--text3)">(opcional)</small></label><input class="m-from" type="date" value="${m.from}" oninput="updateGroupMember(${i},'from',this.value)"></div>

    h += `<div class="grid">`;

    groups.forEach(g => {
      const cs = contrastStyle(g.color);
      // CAMBIO 2: Aplicado filtro de fecha actual aquí también
      const members = people.filter(p=>p.groupId===g.id && p.to >= today);
      if (editGroupId===g.id) {
        const ec = pendingGroupColor || g.color || PALETTE[0];
        h += `<div class="card" style="grid-column:1/-1;border-left:4px solid ${ec}">

      } else {

            <div style="display:flex;gap:4px">
                <button class="btn" style="padding:4px 8px" onclick="setEditGroup('${g.id}')">✎</button>
                 <button class="btn danger" style="padding:4px 8px" onclick="delItem('groups','${g.id}')">✕</button>            </div>
          </div>
          <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:13px;color:var(--text2);line-height:1.7">
            ${members.length ? members.map(m=>`• ${e(m.name)}`).join('<br>') : '<i>Cap persona en aquest grup.</i>'}
          </div>
        </div>`;
      }
    });
    h += `</div>`;
  }

  // ── 0: PERSONES ─────────────────────────────────────────────────────────────
  if (tab===0) {
    const groupOpts = groups.map(g=>`<option value="${g.id}">${e(g.name)}</option>`).join('');
    h += `<div class="form-box">
      <span class="section-label" style="margin-top:0">Nova persona</span>
      <div class="form-row">
        <div class="field"><label>Nom</label><input id="pName"></div>
        <div class="field"><label>Entrada</label><input id="pFrom" type="date"></div>
        <div class="field"><label>Sortida</label><input id="pTo" type="date"></div>
        <div class="field"><label>Grup</label><select id="pGroup"><option value="">Sense grup</option>${groupOpts}</select></div>
        <button class="btn primary" onclick="addPerson()" style="margin-top:auto">+ Afegir</button>
      </div>
    </div>
    <div class="grid">`;
    // CAMBIO 2: Aplicado filtro de fecha actual para listar personas
    people.filter(p => p.to >= today).sort((a,b)=>a.name.localeCompare(b.name)).forEach(p => { h += renderPersonCard(p); });
    h += `</div>`;
  }

  // ── 3: CALENDARI ────────────────────────────────────────────────────────────
  if (tab===3) {
    const base = new Date();
    base.setMonth(base.getMonth()+calOffset);
    const y = base.getFullYear(), m = base.getMonth();
    const daysInMonth = new Date(y,m+1,0).getDate();
    const days = Array.from({length:daysInMonth},(_,i)=>ds(new Date(y,m,i+1)));
    const calStart = days[0];
    const calEnd   = ds(new Date(y,m+1,1));
    const colW = window.innerWidth < 640 ? 32 : 40;

    h += `
    <div style="background: rgba(59, 130, 246, 0.1); border-left: 4px solid #3B82F6; padding: 12px; margin-bottom: 20px; border-radius: 4px; display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 1.2em;">ℹ️</span>
      <p style="margin: 0; color: var(--text1); font-size: 0.95em;">
        Pots arrossegar les barretes de les persones per assignar-les o canviar-les d'habitació.
      </p>
    </div>
  `;

    h += `<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <button class="btn" onclick="changeCalOffset(-1)">← Anterior</button>
      <b style="font-size:15px;text-transform:capitalize">${base.toLocaleDateString('ca',{month:'long',year:'numeric'})}</b>
      <button class="btn" onclick="changeCalOffset(1)">Següent →</button>
    </div>`;

    const sortedRooms = [...rooms].sort((a,b)=>(a.floor||'').localeCompare(b.floor||'')||a.name.localeCompare(b.name));
    const floors = [...new Set(sortedRooms.map(r=>r.floor||'?'))].sort();

    // ─ Compute daily totals for occupancy row ─
    // For each day, count people whose stay overlaps that day
    const dailyCount = days.map(d => people.filter(p => p.from <= d && p.to > d).length);

    // Build segments: consecutive days with same count = one segment
    const segments = [];
    let segStart = 0;
    for (let i = 1; i <= days.length; i++) {
      if (i === days.length || dailyCount[i] !== dailyCount[segStart]) {
        segments.push({ startIdx: segStart, endIdx: i - 1, count: dailyCount[segStart] });
        segStart = i;
      }
    }

    // ─ Desktop Gantt ─
    h += `<div class="cal-desktop"><div class="cal-wrap"><table class="cal-table"><thead><tr>
      <th class="room-col">Habitació</th>`;
    days.forEach(d => {
      const isToday = d===today;
      const nomDia = new Date(d+'T12:00:00').toLocaleDateString('ca', { weekday: 'short' });
      h += `<th style="width:${colW}px;min-width:${colW}px;max-width:${colW}px;box-sizing:content-box;padding:0;${isToday?'background:var(--blue-bg);color:var(--blue)':''}">${d.slice(-2)}<br><small style="font-weight:400;opacity:.7">${nomDia}</small></th>`;
    });
    h += `</tr>`;

    // ── Occupancy summary row ──────────────────────────────────────────────────
    // One tall row in thead: sticky label col + a single colspan td with
    // absolutely-positioned segment blocks. The number inside each block is
    // sticky so it stays visible even when scrolled partly off-screen.
    const occRowH = 36;
    h += `<tr>
      <th class="room-col" style="height:${occRowH}px;font-size:11px;color:var(--text3);font-weight:700;letter-spacing:.05em;border-bottom:2px solid var(--border2)">TOTAL</th>
      <td colspan="${daysInMonth}" style="padding:0;position:relative;height:${occRowH}px;min-width:${daysInMonth*(colW+1)}px;background:var(--surface2);border-bottom:2px solid var(--border2)">`;

    segments.forEach(seg => {
      const leftPx  = seg.startIdx * (colW+1);
      const widthPx = (seg.endIdx - seg.startIdx + 1) * (colW+1);
      const maxCount = Math.max(...dailyCount.filter(c=>c>0), 1);
      const pct = seg.count / maxCount;
      // color: green→yellow→red gradient based on % of max
      const r2 = Math.round(34  + (220-34)  * Math.min(pct*1.6, 1));
      const g2 = Math.round(197 + (53-197)  * Math.min(pct*1.6, 1));
      const b2 = Math.round(94  + (69-94)   * Math.min(pct*1.6, 1));
      const barBg = seg.count === 0 ? 'transparent' : `rgba(${r2},${g2},${b2},0.18)`;
      const textCol = seg.count === 0 ? 'var(--text3)' : `rgb(${Math.round(r2*.7)},${Math.round(g2*.7)},${Math.round(b2*.7)})`;

      h += `<div style="position:absolute;left:${leftPx}px;width:${widthPx}px;top:0;bottom:0;background:${barBg};border-right:1px solid var(--border);display:flex;align-items:center;overflow:hidden">
        <span style="position:sticky;left:${Math.max(0, 140-leftPx)}px;font-size:13px;font-weight:800;color:${textCol};padding:0 6px;white-space:nowrap;pointer-events:none;line-height:1">
          ${seg.count === 0 ? '–' : seg.count + ' pers.'}
        </span>
      </div>`;
    });

    h += `</td></tr>`;
    h += `</thead><tbody>`;
   // --- NUEVO FILTRO DE VISIBILIDAD ---
    const monthStart = days[0]; 
    const monthEnd = days[days.length - 1]; 

    const visibleRooms = sortedRooms.filter(r => {
      if (!r.type || r.type === 'resident') return true;
      if (r.type === 'casa') {
        // Solo mostramos la fila si tiene disponibilidad en este rango de fechas
        return (r.availabilities || []).some(range => range.start <= monthEnd && range.end >= monthStart);
      }
      return false;
    });

// --- FILA DE PERSONAS SIN HABITACIÓN (OPTIMIZADA) ---
const unassignedPeople = people.filter(p => !p.roomId && p.from < calEnd && p.to > calStart);

// Lógica de carriles (tracks) para que no se solapen
const uTracks = [], uAssignments = [];
unassignedPeople.sort((a,b) => a.from.localeCompare(b.from)).forEach(p => {
  let ti = uTracks.findIndex(e => e <= p.from);
  if (ti === -1) { ti = uTracks.length; uTracks.push(p.to); } 
  else { uTracks[ti] = p.to; }
  uAssignments.push({ p, ti });
});

const uTotalTracks = Math.max(1, uTracks.length);
const uRowH = Math.max(50, uTotalTracks * 22); // Altura dinámica según ocupación

h += `<tr class="unassigned-row">
  <td class="room-col" style="border-bottom:2px solid #ffc107; height:${uRowH}px">
    <span class="unassigned-label">⚠️ Pendents</span><br>
    <small style="color:var(--text3)">${unassignedPeople.length} pers.</small>
  </td>
  <td colspan="${daysInMonth}" style="padding:0; position:relative; height:${uRowH}px; min-width:${daysInMonth * colW}px; border-bottom:2px solid #ffc107">
    
    <div style="display:flex; position:absolute; left:0; top:0; bottom:0; width:${daysInMonth * colW}px; z-index:1">
      ${days.map(d => `
        <div style="width:${colW+1}px;" 
             ondragover="event.preventDefault(); this.style.background='rgba(255,193,7,0.1)'" 
             ondragleave="this.style.background=''"
             ondrop="handleDrop(event, 'unassigned', '${d}')">
        </div>`).join('')}
    </div>

    <div style="position:absolute; left:0; top:0; bottom:0; width:${daysInMonth * colW}px; z-index:2; pointer-events:none">`;

uAssignments.forEach(({p, ti}) => {
  const s = p.from < calStart ? calStart : p.from;
  const en = p.to > calEnd ? calEnd : p.to;
  const left = diff(calStart, s) * (colW+1);
  const wid = Math.max(diff(s, en), 0.5) * (colW+1);
  
  // Calculamos posición vertical más compacta (20px por carril)
  const topPos = ti * 20 + 4; 

  h += `<div style="position:absolute; left:${left}px; width:${wid}px; top:${topPos}px; height:18px; padding:1px; pointer-events:auto">
    <div class="p-bar" 
         draggable="true" 
         ondragstart="event.dataTransfer.setData('text/plain', '${p.id}')"
         onclick="openAssignPerson('${p.id}')" 
         style="background:#ffc107; color:#000; cursor:grab; border:1px solid #d39e00; font-size:10px; line-height:16px; padding:0 4px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis" 
         title="${e(p.name)}">
      ${e(p.name)}
    </div>
  </div>`;
});

h += `</div></td></tr>`;


    // Cambiamos sortedRooms por visibleRooms
    visibleRooms.forEach((r, ri) => {
      const nextRoom = visibleRooms[ri+1];
      const isLastOfFloor = !nextRoom || (nextRoom.floor||'?') !== (r.floor||'?');

      const pList = people.filter(p=>p.roomId===r.id&&p.from<calEnd&&p.to>calStart && p.to >= today)
                          .sort((a,b)=>a.from.localeCompare(b.from));
      const tracks=[], assignments=[];
      pList.forEach(p=>{
        let ti=tracks.findIndex(e=>e<=p.from);
        if(ti===-1){ti=tracks.length;tracks.push(p.to);}else{tracks[ti]=p.to;}
        assignments.push({p,ti});
      });

      const totalTracks = Math.max(r.capacity||1, tracks.length);
      const rowH = Math.max(44, totalTracks*28);
      const sepStyle = isLastOfFloor ? 'border-bottom:3px solid #1a1a18!important' : '';

      h += `<tr>
        <td class="room-col" style="${sepStyle}">
          <b>${e(r.name)}</b><br>
          <span style="font-size: 1.4em; line-height: 1; display: block; margin-top: 2px;">${'🛏️ '.repeat(r.capacity)}</span>
        </td> 
        <td colspan="${daysInMonth}" style="padding:0;position:relative;height:${rowH}px;min-width:${daysInMonth*(colW+1)}px;${sepStyle}">
          <div style="display:flex;position:absolute;left:0;top:0;bottom:0;width:${daysInMonth*(colW+1)}px;z-index:1">
            ${days.map(d => {
              // LÓGICA DE BLOQUEO VISUAL
              let isBlocked = false;
              if (r.type === 'casa') {
                isBlocked = !(r.availabilities || []).some(range => d >= range.start && d <= range.end);
              }

              const bg = isBlocked ? 'background:rgba(30,30,30,0.85)' : (d === today ? 'background:rgba(24,95,165,.07)' : '');
              const cursor = isBlocked ? 'cursor:not-allowed' : 'cursor:pointer';
              const clickAction = isBlocked ? '' : `openAssignRoom('${r.id}','${d}')`;

              return `<div 
        style="width:${colW+1}px;border-right:1px dashed var(--border);${bg};${cursor}" 
        onclick="${clickAction}"
        ${!isBlocked ? `
            ondragover="event.preventDefault(); this.style.background='rgba(255,255,255,0.1)'" 
            ondragleave="this.style.background='${bg}'"
            ondrop="handleDrop(event, '${r.id}', '${d}')"
        ` : ''}
    ></div>`;
            }).join('')}
          </div>
          <div style="position:absolute;left:0;top:0;bottom:0;width:${daysInMonth*(colW+1)}px;z-index:2;pointer-events:none">`;

      assignments.forEach(({p,ti})=>{
        const s = p.from<calStart ? calStart : p.from;
        const en = p.to>calEnd ? calEnd : p.to;
        const left = diff(calStart,s)*(colW+1);
        const wid  = Math.max(diff(s,en),0.5)*(colW+1);
        const topP = (ti/totalTracks)*100;
        const hP   = 100/totalTracks;
        const g    = groups.find(x=>x.id===p.groupId);
        const cs   = contrastStyle(g?.color||'#3B82F6');
        h += `<div style="position:absolute;left:${left}px;width:${wid}px;top:${topP}%;height:${hP}%;padding:2px;pointer-events:auto">
          <div class="p-bar" draggable="true" 
         ondragstart="event.dataTransfer.setData('text/plain', '${p.id}')"
         onclick="openAssignPerson('${p.id}')" 
         style="background:${cs.bg};color:${cs.text};cursor:grab" 
         title="${e(p.name)}">
        ${e(p.name)}
          </div>
        </div>`;
      });
      h += `</div></td></tr>`;
    });
    h += `</tbody></table></div></div>`;

    // ─ Mobile list ─
    h += `<div class="cal-mobile">`;
    floors.forEach(floor => {
      const floorRooms = sortedRooms.filter(r=>(r.floor||'?')===floor);
      h += `<div style="margin-bottom:18px">
        <div style="font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--text)">Planta ${e(floor)}</div>`;
      floorRooms.forEach(r=>{
        // CAMBIO 2: Aplicado filtro de fecha actual en móvil
        const occs = people.filter(p=>p.roomId===r.id && p.to >= today).sort((a,b)=>a.from.localeCompare(b.from));
        h += `<div style="margin-bottom:12px">
          <div style="font-weight:600;font-size:13px;margin-bottom:5px">🛏 ${e(r.name)} <span style="font-size:11px;font-weight:400;color:var(--text2)">(cap. ${r.capacity})</span></div>`;
        if (occs.length===0) {
          h += `<div style="font-size:12px;color:var(--text3);padding:8px;background:var(--surface2);border-radius:6px">Sense persones assignades</div>`;
        } else {
          occs.forEach(p=>{
            const g  = groups.find(x=>x.id===p.groupId);
            const cs = g ? contrastStyle(g.color) : null;
            const nights = diff(p.from,p.to);
            h += `<div class="mob-person" onclick="openAssignPerson('${p.id}')">
              <div class="mob-bar" style="background:${cs?cs.bg:'#ccc'}"></div>
              <div style="flex:1;min-width:0">
                <div style="font-weight:600;font-size:13px">${e(p.name)}</div>
                <div class="mob-dates">${p.from} → ${p.to} · ${nights} nit${nights!==1?'s':''}</div>
                ${g?`<div style="font-size:11px;margin-top:2px"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${cs.bg};margin-right:3px"></span>${e(g.name)}</div>`:''}
              </div>
            </div>`;
          });
        }
        h += `</div>`;
      });
      h += `</div>`;
    });
    if (rooms.length===0) h += `<p style="color:var(--text2);font-size:13px">Sense habitacions.</p>`;
    h += `</div>`;
  }

  root.innerHTML = h;

  // ── Modal ────────────────────────────────────────────────────────────────────
  if (assignCtx) {
    let m = `<div class="overlay" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">`;

    if (assignCtx.pId) {
      const p = people.find(x=>x.id===assignCtx.pId);
      m += `<h3>Assignar habitació</h3><p class="modal-sub">${e(p.name)} · ${p.from} → ${p.to}</p>`;

      const sortedForModal = [...rooms].sort((a,b)=>(a.floor||'').localeCompare(b.floor||'')||a.name.localeCompare(b.name));
      const floorsInModal  = [...new Set(sortedForModal.map(r=>r.floor||'?'))];

      floorsInModal.forEach(floor => {
        m += `<div style="display:flex;align-items:center;gap:8px;margin:10px 0 6px">
          <span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3)">Planta ${e(floor)}</span>
          <div style="flex:1;height:1.5px;background:var(--border2);border-radius:1px"></div>
        </div>`;
        sortedForModal.filter(r=>(r.floor||'?')===floor).forEach(r => {
          if (r.type === 'casa') {
            const isAvailable = (r.availabilities || []).some(range => p.from >= range.start && p.to <= range.end);
            if (!isAvailable) return;
          }
          const occs = people.filter(x=>x.roomId===r.id&&x.id!==p.id&&x.from<p.to&&x.to>p.from);
          const full = occs.length >= r.capacity;
          const isCurrent = p.roomId===r.id;
          m += `<div class="assign-opt" style="${isCurrent?'background:var(--blue-bg);border-color:var(--blue-border)':''}" onclick="assignLlit('${p.id}','${r.id}')">
            <span><b>${e(r.name)}</b><br><small style="color:var(--text2)">Ocupació: ${occs.length}/${r.capacity}</small></span>
            ${isCurrent ?`<span class="badge" style="background:var(--blue-bg);color:var(--blue)">Actual</span>`
              :full     ?`<span class="badge" style="background:var(--red-bg);color:var(--red)">Plena</span>`
                        :`<span class="badge" style="background:var(--green-bg);color:var(--green)">Disponible</span>`}
          </div>`;
        });
      });
    } else if (assignCtx.rId) {
      const r = rooms.find(x=>x.id===assignCtx.rId);
      m += `<h3>${e(r.name)}</h3><p class="modal-sub">Dia ${assignCtx.d} · Planta ${r.floor||'?'}</p>`;
      const occs = people.filter(p=>p.roomId===r.id&&p.from<=assignCtx.d&&p.to>assignCtx.d);
      if (occs.length>0) {
        m += `<p class="section-label">Ocupants actuals</p>`;
        occs.forEach(o=>{ m+=`<div class="assign-opt"><span>${e(o.name)}</span><button class="btn danger" onclick="assignLlit('${o.id}',null)">Treure</button></div>`; });
      }
      m += `<p class="section-label" style="margin-top:14px">Afegir persona present aquest dia</p>`;
      // CAMBIO 2: Filtro aplicado en selección desde calendario
      const avail = people.filter(p=>p.from<=assignCtx.d&&p.to>assignCtx.d&&p.roomId!==r.id && p.to >= today);
      if (avail.length===0) m+=`<small style="color:var(--text3)">Cap persona disponible.</small>`;
      avail.forEach(p=>{ m+=`<div class="assign-opt" onclick="assignLlit('${p.id}','${r.id}')">${e(p.name)}</div>`; });
    }

    m += `<button class="btn" style="width:100%;margin-top:12px;border-radius:20px" onclick="closeModal()">Tancar</button></div></div>`;
    root.innerHTML += m;
  }
}

function toggleCasaFields() {
  const type = document.getElementById('erType').value;
  document.getElementById('casaDatesSection').style.display = (type === 'casa') ? 'block' : 'none';
}

window.addAvailRange = (containerId = 'availList') => {
  const container = document.getElementById(containerId);
  if (!container) return; // Seguridad por si el ID no existe
  
  const div = document.createElement('div');
  div.className = 'avail-row';
  div.style = "display:flex; gap:5px; margin-bottom:8px; align-items:center;";
  div.innerHTML = `
    <input type="date" class="avail-start" style="padding:4px; border-radius:4px; border:1px solid var(--border); background:var(--surface1); color:var(--text1)">
    <span style="font-size:12px">fins a</span>
    <input type="date" class="avail-end" style="padding:4px; border-radius:4px; border:1px solid var(--border); background:var(--surface1); color:var(--text1)">
    <button class="btn danger" onclick="this.parentElement.remove()" style="padding:4px 8px">✕</button>
  `;
  container.appendChild(div);
};

window.handleDrop = async (e, roomId, date) => {
    e.preventDefault();
    e.target.style.background = '';
    
    const personId = e.dataTransfer.getData('text/plain');
    const p = people.find(x => x.id === personId);
    if (!p) return;

    // --- DETERMINAR EL NUEVO VALOR ---
    // Si es 'unassigned', el nuevo roomId será null, si no, el roomId que recibimos
    const targetRoomId = (roomId === 'unassigned') ? null : roomId;

    // --- CASO ASIGNAR A HABITACIÓN (Validaciones) ---
    if (targetRoomId !== null) {
        const r = rooms.find(x => x.id === roomId);
        if (!r) return;

        // 1. Validar disponibilidad Casa
        if (r.type === 'casa') {
            const isAvailable = (r.availabilities || []).some(range => p.from >= range.start && p.to <= range.end);
            if (!isAvailable) {
                alert("⚠️ Aquesta habitació tipus 'Casa' no està disponible.");
                return;
            }
        }

        // 2. Validar capacidad
        const occs = people.filter(x => x.roomId === r.id && x.id !== p.id && x.from < p.to && x.to > p.from);
        if (occs.length >= r.capacity) {
            alert("⚠️ Habitació plena!");
            return;
        }
    }

    // --- ✍️ ANOTAR EN EL HISTORIAL (Solo llegamos aquí si las validaciones pasaron) ---
    historial.push({
        tipo: 'CAMBIO_HABITACION',
        pId: p.id,
        oldValue: p.roomId, // donde estaba
        newValue: targetRoomId // a donde va
    });

    if (historial.length > 30) {
        historial.shift(); 
    }
    historialRedo = []; // Al hacer algo nuevo, limpiamos el "rehacer"

    // --- 💾 GUARDAR CAMBIO EN FIREBASE ---
    try {
        await updateDoc(doc(db, 'people', p.id), { roomId: targetRoomId });
        if (typeof render === 'function') render(); 
    } catch (err) { 
        console.error("Error movent la persona:", err); 
        historial.pop(); // Si Firebase falla, borramos la última acción del historial
    }
};

window.desferAccio = async () => {
  if (historial.length === 0) return; // Si no hi ha res a la pila, no fem res

  const ultimaAccio = historial.pop(); // Traiem l'últim "plat" 🍽️

  try {
    // 1. Fem l'actualització a Firebase amb les dades guardades
    await updateDoc(doc(db, 'people', ultimaAccio.pId), { 
      roomId: ultimaAccio.oldRoomId 
    });

    // 2. Refresquem la pantalla per veure el canvi
    render(); 
  } catch (err) {
    console.error("Error al desfer:", err);
  }
};

// --- FUNCIÓN DESHACER ---
window.deshacer = async () => {
    if (historial.length === 0) return;

    const accion = historial.pop(); // Sacamos la última acción de la lista
    historialRedo.push(accion);    // La guardamos en Redo por si queremos volver a hacerla

    if (accion.tipo === 'CAMBIO_HABITACION') {
        try {
            // Devolvemos a la persona a su 'oldValue' (habitación anterior)
            await updateDoc(doc(db, 'people', accion.pId), { 
                roomId: accion.oldValue 
            });
            if (typeof render === 'function') render();
        } catch (err) {
            console.error("Error al deshacer:", err);
        }
    }
};

// --- FUNCIÓN REHACER ---
window.rehacer = async () => {
    if (historialRedo.length === 0) return;

    const accion = historialRedo.pop(); // Sacamos de la lista de Redo
    historial.push(accion);             // La devolvemos al historial normal

    if (accion.tipo === 'CAMBIO_HABITACION') {
        try {
            // Aplicamos de nuevo el 'newValue' (el cambio que habíamos deshecho)
            await updateDoc(doc(db, 'people', accion.pId), { 
                roomId: accion.newValue 
            });
            if (typeof render === 'function') render();
        } catch (err) {
            console.error("Error al rehacer:", err);
        }
    }
};

document.addEventListener('keydown', (e) => {
    // Detectamos si se pulsa Control o Command (metaKey es la tecla Command en Mac)
    const isModKey = e.ctrlKey || e.metaKey;

    if (isModKey && e.key === 'z') {
        e.preventDefault();
        // Si además pulsas Shift (Mayús), suele ser el atajo para Rehacer
        if (e.shiftKey) {
            window.rehacer();
        } else {
            window.deshacer();
        }
    }

    // Atajo alternativo para Rehacer: Ctrl+Y (Win) o Cmd+Y (Mac)
    if (isModKey && e.key === 'y') {
        e.preventDefault();
        window.rehacer();
    }
});

// ── Attach comment button listeners (avoids onclick/module scope issues) ──────
// ── Comments functions ───────────────────────────────────────────────────────
let commentsOpen = false;

function toggleComments() {
  commentsOpen = !commentsOpen;
  document.getElementById('commentPanel').classList.toggle('open', commentsOpen);
  document.getElementById('commentFabLabel').textContent = commentsOpen ? 'Tancar' : 'Comentaris';
}

async function submitComment() {
  const author = document.getElementById('commentAuthor').value.trim();
  const text   = document.getElementById('commentText').value.trim();
  if (!author || !text) { alert('Cal posar el teu nom i el comentari.'); return; }
  const btn = document.getElementById('commentSubmit');
  btn.disabled = true; btn.textContent = 'Enviant…';
  try {
    await addDoc(collection(db,'comments'), { author, text, createdAt: new Date().toISOString() });
    document.getElementById('commentText').value = '';
  } catch(err) { alert('Error enviant: ' + err.message); }
  btn.disabled = false; btn.textContent = 'Enviar comentari';
}

function renderComments(comments) {
  const list = document.getElementById('commentList');
  if (!list) return;
  if (comments.length === 0) {
    list.innerHTML = '<div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Sense comentaris. Sigues el primer!</div>';
    return;
  }
  list.innerHTML = comments.map(c => {
    const d = c.createdAt ? new Date(c.createdAt).toLocaleString('ca-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
    const safeAuthor = (c.author||'Anonim').replace(/</g,'&lt;');
    const safeText   = (c.text||'').replace(/</g,'&lt;').replace(/\n/g,'<br>');
    return `<div class="comment-item">
      <div class="comment-author">${safeAuthor}</div>
      <div style="line-height:1.5">${safeText}</div>
      <div class="comment-time">${d}</div>
    </div>`;
  }).join('');
}

document.getElementById('commentFab').addEventListener('click', toggleComments);
document.getElementById('commentClose').addEventListener('click', toggleComments);
document.getElementById('commentSubmit').addEventListener('click', submitComment);
</script>
